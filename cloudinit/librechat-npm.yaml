#cloud-config
# =============================================================================
# LibreChat (npm) "one-click app" — Ubuntu 26.04 LTS cloud-init user-data
# Stack: Node.js 24 + MongoDB 8 + LibreChat (from source)
#        + Meilisearch 1.35 (host) + PostgreSQL 16 + pgvector
#        + Redis (cache/sessions) + SearXNG (web search) + RAG API
#        + Stable Diffusion WebUI (A1111 fork, CPU mode)
#        + Miniconda Python 3.10
#        + Nginx + UFW firewall + fail2ban + swap + unattended-upgrades
# -----------------------------------------------------------------------------
# EDIT the variables in /root/.librechat-npm-bootstrap.env before first boot,
# OR leave defaults — secrets are auto-generated at boot time.
# =============================================================================

hostname: librechat-npm
manage_etc_hosts: true
timezone: UTC

# ----------------------------------------------------------------------------
# Users — keep 'default' so provisioner can inject the customer's SSH key
# ----------------------------------------------------------------------------
users:
  - default
  - name: librechat
    # Home must match WorkingDirectory/HOME in librechat-npm.service; the default
    # /home/librechat is unreachable under ProtectHome=true.
    homedir: /opt/librechat
    groups: [www-data]
    shell: /bin/bash

# ----------------------------------------------------------------------------
# Swap (2 GB helps survive npm installs / MongoDB startup on tight-memory VMs)
# ----------------------------------------------------------------------------
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

# ----------------------------------------------------------------------------
# Packages
# Node.js 24 installed via NodeSource in bootstrap (not in packages list).
# MongoDB 8.0 installed via official MongoDB apt repo in bootstrap.
# PostgreSQL 16 + pgvector installed via PGDG apt repo in bootstrap.
# Meilisearch installed via official binary in bootstrap.
# Redis installed via apt in bootstrap.
# Miniconda, SearXNG, Stable Diffusion WebUI installed in bootstrap.
# ----------------------------------------------------------------------------
package_update: true
package_upgrade: false

packages:
  # Core utilities
  - curl
  - wget
  - git
  - unzip
  - ca-certificates
  - gnupg
  - lsb-release
  - software-properties-common
  - apt-transport-https
  # Security
  - ufw
  - fail2ban
  - unattended-upgrades
  - apt-listchanges
  # Build tools (native Node addons)
  - build-essential
  - pkg-config
  - libssl-dev
  - libffi-dev
  # Python
  - python3
  - python3-pip
  - python3-venv
  # Web / TLS
  - nginx
  - certbot
  - python3-certbot-nginx
  # Monitoring / ops
  - htop
  - jq
  - tmux

# ----------------------------------------------------------------------------
# Config files and bootstrap script dropped to disk before runcmd
# ----------------------------------------------------------------------------
write_files:

  # --------------------------------------------------------------------------
  # (a) Operator-editable environment variables
  # --------------------------------------------------------------------------
  - path: /root/.librechat-npm-bootstrap.env
    permissions: '0600'
    owner: root:root
    content: |
      # EDIT THESE BEFORE FIRST BOOT (or leave for auto-generation)
      APP_DOMAIN="example.com"
      LE_EMAIL="admin@example.com"
      ENABLE_TLS="true"

      LIBRECHAT_DIR="/opt/librechat"
      LIBRECHAT_USER="librechat"
      LIBRECHAT_PORT="3080"

      # MongoDB settings
      MONGO_PORT="27017"
      MONGO_ADMIN_USER="mongoadmin"
      MONGO_ADMIN_PASS="CHANGE_ME"
      MONGO_DB_NAME="librechat"

      # JWT/Creds — auto-generated when CHANGE_ME
      JWT_SECRET="CHANGE_ME"
      JWT_REFRESH_SECRET="CHANGE_ME"
      CREDS_KEY="CHANGE_ME"
      CREDS_IV="CHANGE_ME"

      # Admin account (first user to register becomes admin, or set here)
      LIBRECHAT_ADMIN_EMAIL="admin@example.com"
      LIBRECHAT_ADMIN_PASS="CHANGE_ME"

      # API keys (optional — set later via UI or here)
      OPENAI_API_KEY="CHANGE_ME"
      ANTHROPIC_API_KEY="CHANGE_ME"

      # Meilisearch (host service for search/RAG)
      MEILI_PORT="7700"
      MEILI_MASTER_KEY="CHANGE_ME"

      # RAG API (file uploads / retrieval — LibreChat reads RAG_API_URL)
      RAG_PORT="8000"

      # Vector DB (PostgreSQL + pgvector for RAG)
      VECTOR_DB_PORT="5432"
      VECTOR_DB_NAME="librechat_vectordb"
      VECTOR_DB_USER="librechat_vec"
      VECTOR_DB_PASS="CHANGE_ME"

      # Redis (cache + session store for LibreChat)
      REDIS_PORT="6379"
      REDIS_HOST="127.0.0.1"
      USE_REDIS="true"
      REDIS_URI="redis://127.0.0.1:6379"

      # SearXNG (self-hosted web search backend for LibreChat)
      SEARXNG_PORT="8888"

      # Stable Diffusion WebUI (A1111 fork, CPU mode)
      SD_WEBUI_PORT="7860"

  # --------------------------------------------------------------------------
  # (b) Nginx reverse-proxy vhost
  # --------------------------------------------------------------------------
  - path: /etc/nginx/sites-available/librechat-npm
    permissions: '0644'
    owner: root:root
    content: |
      # Standard nginx websocket idiom: "upgrade" only when the client asked for
      # it, empty otherwise. Hardcoding `Connection upgrade` on every request
      # also defeats the upstream keepalive pool below, since a connection
      # flagged for upgrade cannot be reused.
      map $http_upgrade $connection_upgrade {
          default upgrade;
          ''      '';
      }

      upstream librechat_backend {
          server 127.0.0.1:LIBRECHAT_PORT_PLACEHOLDER;
          keepalive 32;
      }

      server {
          listen 80;
          listen [::]:80;
          server_name APP_DOMAIN_PLACEHOLDER;

          # Security headers
          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-XSS-Protection "1; mode=block" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;

          # Allow large file uploads (document attachments, images)
          client_max_body_size 100M;

          # Pass requests to LibreChat backend
          location / {
              proxy_pass         http://librechat_backend;
              proxy_http_version 1.1;
              # WebSocket / SSE support (LibreChat streams responses)
              proxy_set_header   Upgrade $http_upgrade;
              proxy_set_header   Connection $connection_upgrade;
              proxy_set_header   Host $host;
              proxy_set_header   X-Real-IP $remote_addr;
              proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header   X-Forwarded-Proto $scheme;
              proxy_cache_bypass $http_upgrade;
              proxy_read_timeout 600s;
              proxy_send_timeout 600s;
              proxy_buffering    off;
          }

          location = /favicon.ico { log_not_found off; access_log off; }
          location = /robots.txt  { log_not_found off; access_log off; allow all; }
          location ~ /\.well-known { allow all; }
          location ~ /\.(?!well-known).* { deny all; }
      }

  # --------------------------------------------------------------------------
  # (c) systemd service for LibreChat (npm run backend)
  # --------------------------------------------------------------------------
  - path: /etc/systemd/system/librechat-npm.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=LibreChat (npm) backend server
      After=network.target mongod.service meilisearch.service redis.service searxng.service
      Wants=network.target mongod.service meilisearch.service redis.service searxng.service

      [Service]
      Type=simple
      User=librechat
      Group=librechat
      WorkingDirectory=/opt/librechat
      EnvironmentFile=/etc/librechat.env
      # ProtectHome=true hides /home, so npm must not fall back to ~librechat for
      # its cache/config — point HOME at the install dir, which is in ReadWritePaths.
      Environment=HOME=/opt/librechat
      Environment=npm_config_cache=/opt/librechat/.npm-cache
      ExecStart=/usr/bin/npm run backend
      Restart=on-failure
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=librechat-npm
      # Allow enough time for first-run build/compile
      TimeoutStartSec=300

      # Hardening
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/opt/librechat

      [Install]
      WantedBy=multi-user.target

  # --------------------------------------------------------------------------
  # (d) Meilisearch systemd service
  # --------------------------------------------------------------------------
  - path: /etc/systemd/system/meilisearch.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Meilisearch (host) — search/RAG engine for LibreChat
      After=network.target
      Wants=network.target

      [Service]
      Type=simple
      User=meilisearch
      Group=meilisearch
      # NOTE: systemd does NOT expand ${VAR} in Environment= from the invoking
      # shell — the real key is delivered via this file, written by the bootstrap.
      EnvironmentFile=/etc/meilisearch.env
      # cwd matters: Meilisearch resolves relative dump/snapshot paths against it,
      # and ProtectSystem=strict leaves / read-only.
      WorkingDirectory=/var/lib/meilisearch
      ExecStart=/usr/local/bin/meilisearch
      Restart=on-failure
      RestartSec=5
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=meilisearch

      # Hardening
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/var/lib/meilisearch

      [Install]
      WantedBy=multi-user.target

  # (e) Meilisearch is configured entirely through /etc/meilisearch.env, which
  #     the bootstrap writes and meilisearch.service loads. There is deliberately
  #     no /etc/meilisearch.toml — a second config file that nothing loads would
  #     just mislead whoever edits it.

  # --------------------------------------------------------------------------
  # (f) Redis systemd service
  # --------------------------------------------------------------------------
  - path: /etc/systemd/system/redis.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Redis In-Memory Data Store (LibreChat cache/sessions)
      After=network.target
      Wants=network.target

      [Service]
      # redis.conf sets "supervised systemd" + "daemonize no", so redis stays in
      # the foreground and reports readiness over sd_notify. Passing
      # --daemonize yes here would fork and exit, and systemd would reap the unit.
      Type=notify
      User=redis
      Group=redis
      ExecStart=/usr/bin/redis-server /etc/redis/redis.conf
      Restart=on-failure
      RestartSec=5
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=redis

      # Hardening
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/var/lib/redis /var/log/redis

      [Install]
      WantedBy=multi-user.target

  # --------------------------------------------------------------------------
  # (g) Redis config
  # --------------------------------------------------------------------------
  - path: /etc/redis/redis.conf
    permissions: '0644'
    owner: root:root
    content: |
      bind 127.0.0.1
      port REDIS_PORT_PLACEHOLDER
      protected-mode yes
      daemonize no
      supervised systemd
      dir /var/lib/redis
      dbfilename dump.rdb
      logfile /var/log/redis/redis.log
      maxmemory 256mb
      maxmemory-policy allkeys-lru

  # --------------------------------------------------------------------------
  # (h) SearXNG systemd service (LibreChat's web-search backend)
  #
  # Runs under granian, which is what SearXNG upstream ships in its own
  # container. All tuning comes from /etc/searxng/searxng.env — systemd does not
  # expand $(...) or ${VAR} in Environment=, so anything dynamic (the secret,
  # the port) must arrive through an EnvironmentFile written at boot.
  # --------------------------------------------------------------------------
  - path: /etc/systemd/system/searxng.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=SearXNG meta search engine (LibreChat web search)
      After=network.target
      Wants=network.target

      [Service]
      Type=simple
      User=searxng
      Group=searxng
      WorkingDirectory=/opt/searxng
      EnvironmentFile=/etc/searxng/searxng.env
      ExecStart=/opt/searxng/venv/bin/granian searx.webapp:app
      Restart=on-failure
      RestartSec=5
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=searxng

      # Hardening
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/opt/searxng /var/log/searxng

      [Install]
      WantedBy=multi-user.target

  # --------------------------------------------------------------------------
  # (i) Stable Diffusion WebUI launch script
  # --------------------------------------------------------------------------
  - path: /opt/webui-user.sh
    permissions: '0755'
    owner: root:root
    content: |
      #!/bin/bash
      export PYTHON="/opt/miniconda/envs/sd/bin/python"
      export SKIP_TORCH_INSTALL=1
      export CUDA_VISIBLE_DEVICES=""
      export COMMANDLINE_ARGS="--api --listen --cpu --skip-torch-cuda-test --skip-python-version-check --use-cpu all"
      cd /opt/stable-diffusion-webui
      exec /opt/miniconda/envs/sd/bin/python launch.py "$@"

  # --------------------------------------------------------------------------
  # (k) Stable Diffusion WebUI systemd service
  # --------------------------------------------------------------------------
  - path: /etc/systemd/system/stable-diffusion.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Stable Diffusion WebUI (A1111 fork)
      After=network.target

      [Service]
      Type=simple
      User=stablediffusion
      Group=stablediffusion
      WorkingDirectory=/opt/stable-diffusion-webui
      ExecStart=/opt/webui-user.sh
      Restart=on-failure
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=stable-diffusion
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/opt/stable-diffusion-webui /opt/miniconda

      [Install]
      WantedBy=multi-user.target

  # --------------------------------------------------------------------------
  # (l) fail2ban jails
  # --------------------------------------------------------------------------
  - path: /etc/fail2ban/jail.d/librechat-npm.local
    permissions: '0644'
    owner: root:root
    content: |
      [sshd]
      enabled  = true
      maxretry = 4
      bantime  = 1h
      findtime = 600

      [nginx-http-auth]
      enabled  = true
      maxretry = 5
      bantime  = 3600
      findtime = 600

      [nginx-botsearch]
      enabled  = true
      maxretry = 5
      bantime  = 3600
      findtime = 600

  # --------------------------------------------------------------------------
  # (m) Unattended security upgrades
  # --------------------------------------------------------------------------
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    owner: root:root
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  # --------------------------------------------------------------------------
  # (n) MongoDB sysctl tunings (mirrors mongodb.yaml pattern)
  # --------------------------------------------------------------------------
  - path: /etc/sysctl.d/99-librechat-mongodb.conf
    permissions: '0644'
    owner: root:root
    content: |
      vm.swappiness=1
      vm.max_map_count=262144

  - path: /etc/security/limits.d/99-mongodb.conf
    permissions: '0644'
    owner: root:root
    content: |
      mongodb soft nofile 64000
      mongodb hard nofile 64000
      mongodb soft nproc  32000
      mongodb hard nproc  32000
      mongodb soft memlock unlimited
      mongodb hard memlock unlimited

  # --------------------------------------------------------------------------
  # (o) systemd override to raise mongod file/process limits
  # --------------------------------------------------------------------------
  - path: /etc/systemd/system/mongod.service.d/override.conf
    permissions: '0644'
    owner: root:root
    content: |
      [Service]
      LimitNOFILE=64000
      LimitNPROC=32000
      LimitMEMLOCK=infinity

  # --------------------------------------------------------------------------
  # (p) Disable Transparent Huge Pages at boot (MongoDB requirement)
  # --------------------------------------------------------------------------
  - path: /etc/systemd/system/disable-thp.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Disable Transparent Huge Pages (MongoDB recommendation)
      After=network.target
      Before=mongod.service

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'echo never > /sys/kernel/mm/transparent_hugepage/enabled; echo never > /sys/kernel/mm/transparent_hugepage/defrag'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

  # --------------------------------------------------------------------------
  # (q) PostgreSQL 16 pgvector setup script
  # --------------------------------------------------------------------------
  - path: /root/setup-pgvector.sh
    permissions: '0700'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      # setup-pgvector.sh — installs PostgreSQL 16 + pgvector, creates vector DB
      set -euo pipefail

      source /root/.librechat-npm-bootstrap.env

      log() { echo "[setup-pgvector] $(date -u '+%Y-%m-%dT%H:%M:%SZ') $*"; }

      # --------------------------------------------------------------------------
      # Install PostgreSQL 16 + pgvector via PGDG apt repo
      # --------------------------------------------------------------------------
      log "Installing PostgreSQL 16 + pgvector..."

      # Install PGDG apt repo if not present
      if [ ! -f /etc/apt/sources.list.d/pgdg.list ]; then
        apt-get install -y curl ca-certificates
        curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
        echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list
        apt-get update -qq
      fi

      # Install PostgreSQL 16 + pgvector
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        postgresql-16 \
        postgresql-16-pgvector

      # Pin packages to prevent accidental version upgrades
      for _pkg in postgresql-16 postgresql-16-pgvector; do
        echo "${_pkg} hold" | dpkg --set-selections 2>/dev/null || true
      done

      # Start PostgreSQL 16
      log "Starting PostgreSQL 16..."
      systemctl enable --now postgresql@16-main || systemctl start postgresql || true

      # Wait for PostgreSQL to be ready
      for _i in $(seq 1 10); do
        if su - postgres -c "psql -c 'SELECT 1'" >/dev/null 2>&1; then
          log "PostgreSQL 16 is up."
          break
        fi
        log "  attempt ${_i}/10 ..."
        sleep 2
      done

      # --------------------------------------------------------------------------
      # Create vector DB, user, and enable pgvector extension
      # --------------------------------------------------------------------------
      log "Creating vector database and user..."

      # The SQL is written to a temp file and the real values substituted in,
      # rather than interpolated by the shell. A quoted heredoc is required here
      # because the DO block uses $$ dollar-quoting, which an unquoted heredoc
      # would expand to the shell's PID. Previously this meant the role was
      # created with the LITERAL password 'CHANGE_ME' while LibreChat was handed
      # the generated one, so every RAG/vector connection failed to authenticate.
      _pgsql="$(mktemp /tmp/pgvector-setup.XXXXXX.sql)"
      cat > "${_pgsql}" <<-'PSQLJS'
      -- Create user if not exists
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'VECTOR_DB_USER_PLACEHOLDER') THEN
          CREATE ROLE VECTOR_DB_USER_PLACEHOLDER WITH LOGIN PASSWORD 'VECTOR_DB_PASS_PLACEHOLDER';
        ELSE
          ALTER ROLE VECTOR_DB_USER_PLACEHOLDER WITH LOGIN PASSWORD 'VECTOR_DB_PASS_PLACEHOLDER';
        END IF;
      END
      $$;

      -- Create database if not exists
      SELECT 'CREATE DATABASE VECTOR_DB_NAME_PLACEHOLDER'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'VECTOR_DB_NAME_PLACEHOLDER')\gexec

      -- Grant privileges
      GRANT ALL PRIVILEGES ON DATABASE VECTOR_DB_NAME_PLACEHOLDER TO VECTOR_DB_USER_PLACEHOLDER;

      -- Enable vector extension in the database
      \c VECTOR_DB_NAME_PLACEHOLDER
      CREATE EXTENSION IF NOT EXISTS vector;
      GRANT ALL ON SCHEMA public TO VECTOR_DB_USER_PLACEHOLDER;
      PSQLJS

      sed -i "s|VECTOR_DB_USER_PLACEHOLDER|${VECTOR_DB_USER}|g" "${_pgsql}"
      sed -i "s|VECTOR_DB_NAME_PLACEHOLDER|${VECTOR_DB_NAME}|g" "${_pgsql}"
      sed -i "s|VECTOR_DB_PASS_PLACEHOLDER|${VECTOR_DB_PASS}|g" "${_pgsql}"
      chown postgres:postgres "${_pgsql}"
      chmod 600 "${_pgsql}"
      su - postgres -c "psql -f ${_pgsql}" || log "WARN: pgvector SQL returned non-zero"
      rm -f "${_pgsql}"

      log "PostgreSQL + pgvector setup complete."
      log "  Database: ${VECTOR_DB_NAME}"
      log "  User: ${VECTOR_DB_USER}"
      log "  Port: ${VECTOR_DB_PORT}"

  # --------------------------------------------------------------------------
  # (j) SearXNG install script
  #
  # Deliberately a separate script with its own `set -e`: SearXNG is an optional
  # enhancement, and the caller invokes it with `|| log WARN` so that a failure
  # here degrades to "no web search" instead of aborting the whole boot (which
  # is what happened in the earlier searxng build of this template).
  # --------------------------------------------------------------------------
  - path: /root/setup-searxng.sh
    permissions: '0700'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      # setup-searxng.sh — installs SearXNG from source into a venv and starts it
      set -euo pipefail

      source /root/.librechat-npm-bootstrap.env

      log() { echo "[setup-searxng] $(date -u '+%Y-%m-%dT%H:%M:%SZ') $*"; }

      SEARXNG_PORT="${SEARXNG_PORT:-8888}"
      SEARXNG_DIR="/opt/searxng"
      SEARXNG_VENV="${SEARXNG_DIR}/venv"

      log "Installing SearXNG build dependencies..."
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        python3-dev python3-venv python3-babel \
        libxml2-dev libxslt1-dev zlib1g-dev libffi-dev libssl-dev

      # -U so the matching 'searxng' group is created deterministically — the
      # chown/systemd Group= below depend on it existing.
      id -u searxng &>/dev/null || useradd --system -U --home-dir "${SEARXNG_DIR}" --shell /usr/sbin/nologin searxng
      mkdir -p "${SEARXNG_DIR}" /var/log/searxng /etc/searxng

      # ------------------------------------------------------------------------
      # Source checkout.
      #
      # NOTE: there is no SearXNG search engine on PyPI — `pip install searxng`
      # pulls an unrelated pre-alpha MCP package and yields no webapp at all.
      # Upstream's supported install is an editable install from the git tree.
      # ------------------------------------------------------------------------
      # Checkout is chowned to searxng below but git runs here as root — without
      # this the re-run pull dies on "detected dubious ownership".
      git config --global --add safe.directory "${SEARXNG_DIR}" 2>/dev/null || true
      if [ -d "${SEARXNG_DIR}/.git" ]; then
        log "SearXNG already cloned — pulling latest..."
        git -C "${SEARXNG_DIR}" pull --ff-only || log "WARN: git pull failed — using existing checkout"
      else
        # Keep the venv if a previous run left one behind
        rm -rf "${SEARXNG_DIR}/searx" "${SEARXNG_DIR}/.git"
        git clone --depth 1 https://github.com/searxng/searxng.git "${SEARXNG_DIR}/.searxng-src"
        cp -a "${SEARXNG_DIR}/.searxng-src/." "${SEARXNG_DIR}/"
        rm -rf "${SEARXNG_DIR}/.searxng-src"
      fi

      log "Creating SearXNG virtualenv..."
      [ -x "${SEARXNG_VENV}/bin/python" ] || python3 -m venv "${SEARXNG_VENV}"

      # Build prerequisites first, per upstream's installation guide
      "${SEARXNG_VENV}/bin/pip" install -q --upgrade pip setuptools wheel
      "${SEARXNG_VENV}/bin/pip" install -q --upgrade pyyaml msgspec typing-extensions pybind11

      log "Installing SearXNG (editable) and the granian app server..."
      "${SEARXNG_VENV}/bin/pip" install -q --use-pep517 --no-build-isolation -e "${SEARXNG_DIR}"
      # granian lives in requirements-server.txt, not requirements.txt
      if [ -f "${SEARXNG_DIR}/requirements-server.txt" ]; then
        "${SEARXNG_VENV}/bin/pip" install -q -r "${SEARXNG_DIR}/requirements-server.txt"
      else
        "${SEARXNG_VENV}/bin/pip" install -q granian
      fi

      # ------------------------------------------------------------------------
      # Settings.
      #
      # `use_default_settings: true` layers these few keys over upstream's
      # settings.yml, so we never have to sed-patch their file (every such patch
      # in the previous template silently missed and left defaults in place).
      #
      # `json` in formats is REQUIRED — LibreChat queries /search?format=json and
      # SearXNG ships with html only, so without this every search 403s.
      # ------------------------------------------------------------------------
      log "Writing /etc/searxng/settings.yml..."
      SEARXNG_SECRET="$(LC_ALL=C tr -dc 'a-f0-9' </dev/urandom 2>/dev/null | head -c 64 || true)"
      cat > /etc/searxng/settings.yml <<-SEARXSETTINGS
      use_default_settings: true
      general:
        instance_name: "LibreChat Search"
        enable_metrics: false
      server:
        secret_key: "${SEARXNG_SECRET}"
        bind_address: "127.0.0.1"
        port: ${SEARXNG_PORT}
        # limiter/public_instance off: bot detection would block API clients.
        limiter: false
        public_instance: false
        image_proxy: false
        # Upstream defaults to POST, which makes GET /search?format=json return
        # 405. POST exists to keep queries out of logs/referrers on PUBLIC
        # instances; this one is bound to 127.0.0.1 for LibreChat only.
        method: "GET"
      search:
        safe_search: 0
        formats:
          - html
          - json
      SEARXSETTINGS
      chown root:searxng /etc/searxng/settings.yml
      chmod 640 /etc/searxng/settings.yml

      log "Writing /etc/searxng/searxng.env..."
      cat > /etc/searxng/searxng.env <<-SEARXENV
      SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      GRANIAN_INTERFACE=wsgi
      GRANIAN_HOST=127.0.0.1
      GRANIAN_PORT=${SEARXNG_PORT}
      GRANIAN_PROCESS_NAME=searxng
      GRANIAN_WEBSOCKETS=false
      GRANIAN_BLOCKING_THREADS=4
      SEARXENV
      chown root:searxng /etc/searxng/searxng.env
      chmod 640 /etc/searxng/searxng.env

      chown -R searxng:searxng "${SEARXNG_DIR}" /var/log/searxng

      log "Starting SearXNG..."
      systemctl daemon-reload
      systemctl enable searxng
      systemctl restart searxng

      # Confirm it actually answers JSON — a 200 on / only proves the web app is
      # up, not that the format LibreChat needs is enabled.
      SEARXNG_READY=0
      for _i in $(seq 1 15); do
        if curl -sf "http://127.0.0.1:${SEARXNG_PORT}/search?q=test&format=json" >/dev/null 2>&1; then
          SEARXNG_READY=1
          log "SearXNG is up and serving JSON."
          break
        fi
        log "  attempt ${_i}/15 ..."
        sleep 3
      done
      if [ "${SEARXNG_READY}" -eq 0 ]; then
        log "WARN: SearXNG did not answer a JSON search — check journalctl -u searxng"
        exit 1
      fi

      log "SearXNG setup complete on port ${SEARXNG_PORT}."

  # --------------------------------------------------------------------------
  # (s) RAG API systemd service (LibreChat file-upload / retrieval backend)
  # --------------------------------------------------------------------------
  - path: /etc/systemd/system/rag-api.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=LibreChat RAG API (file uploads, embeddings, retrieval)
      After=network.target postgresql.service
      Wants=network.target

      [Service]
      Type=simple
      User=ragapi
      Group=ragapi
      WorkingDirectory=/opt/rag-api
      EnvironmentFile=/etc/rag-api.env
      ExecStart=/opt/rag-api/venv/bin/python main.py
      Restart=on-failure
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=rag-api
      # Local embedding models load slowly on first start
      TimeoutStartSec=600

      # Hardening
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/opt/rag-api

      [Install]
      WantedBy=multi-user.target

  # --------------------------------------------------------------------------
  # (t) RAG API install script
  #
  # Separate script with its own `set -e`, invoked with `|| log WARN` — RAG is
  # an enhancement and must never abort the boot.
  # --------------------------------------------------------------------------
  - path: /root/setup-rag-api.sh
    permissions: '0700'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      # setup-rag-api.sh — installs danny-avila/rag_api against the local pgvector DB
      set -euo pipefail

      source /root/.librechat-npm-bootstrap.env

      log() { echo "[setup-rag-api] $(date -u '+%Y-%m-%dT%H:%M:%SZ') $*"; }

      RAG_PORT="${RAG_PORT:-8000}"
      RAG_DIR="/opt/rag-api"
      RAG_VENV="${RAG_DIR}/venv"

      log "Installing RAG API system dependencies..."
      # pandoc/libgl/libglib are required by `unstructured` for document parsing
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        python3-dev python3-venv pandoc netcat-openbsd libgl1 libglib2.0-0 \
        libxml2-dev libxslt1-dev zlib1g-dev libffi-dev libssl-dev

      id -u ragapi &>/dev/null || useradd --system -U --home-dir "${RAG_DIR}" --shell /usr/sbin/nologin ragapi
      mkdir -p "${RAG_DIR}" "${RAG_DIR}/uploads" "${RAG_DIR}/nltk_data"

      git config --global --add safe.directory "${RAG_DIR}" 2>/dev/null || true
      if [ -d "${RAG_DIR}/.git" ]; then
        log "RAG API already cloned — pulling latest..."
        git -C "${RAG_DIR}" pull --ff-only || log "WARN: git pull failed — using existing checkout"
      else
        # Clone to scratch then move in: ${RAG_DIR} already holds uploads/ and
        # nltk_data/, and git clone refuses a non-empty destination.
        _rag_src="$(mktemp -d /tmp/rag-api-src.XXXXXX)"
        rm -rf "${_rag_src}"
        git clone --depth 1 https://github.com/danny-avila/rag_api.git "${_rag_src}"
        cp -a "${_rag_src}/." "${RAG_DIR}/"
        rm -rf "${_rag_src}"
      fi

      log "Creating RAG API virtualenv..."
      [ -x "${RAG_VENV}/bin/python" ] || python3 -m venv "${RAG_VENV}"
      "${RAG_VENV}/bin/pip" install -q --upgrade pip setuptools wheel

      # Install CPU-only torch FIRST so sentence_transformers does not drag in
      # the multi-gigabyte CUDA build on a machine with no GPU.
      log "Installing CPU-only torch (no GPU on standard VPS plans)..."
      "${RAG_VENV}/bin/pip" install -q torch --index-url https://download.pytorch.org/whl/cpu

      log "Installing RAG API requirements (several minutes)..."
      "${RAG_VENV}/bin/pip" install -q -r "${RAG_DIR}/requirements.txt"

      # Pre-download NLTK corpora so `unstructured` does not fetch them at
      # runtime — the service runs under ProtectSystem=strict and would fail.
      log "Downloading NLTK data..."
      "${RAG_VENV}/bin/python" -m nltk.downloader -d "${RAG_DIR}/nltk_data" \
        punkt_tab averaged_perceptron_tagger averaged_perceptron_tagger_eng \
        || log "WARN: NLTK download had issues — some document types may fail"

      # ------------------------------------------------------------------------
      # Embeddings provider.
      #
      # Default to local sentence-transformers so file uploads work on a box
      # with no API key at all. If the operator supplied a real OpenAI key,
      # prefer it: it is faster and avoids loading a model into RAM.
      # ------------------------------------------------------------------------
      if [ -n "${OPENAI_API_KEY:-}" ] && [ "${OPENAI_API_KEY}" != "CHANGE_ME" ]; then
        RAG_EMBED_PROVIDER="openai"
        RAG_EMBED_MODEL="text-embedding-3-small"
        log "Using OpenAI embeddings (API key present)."
      else
        RAG_EMBED_PROVIDER="huggingface"
        RAG_EMBED_MODEL="sentence-transformers/all-MiniLM-L6-v2"
        log "No OpenAI key — using local sentence-transformers embeddings."
      fi

      log "Writing /etc/rag-api.env..."
      cat > /etc/rag-api.env <<-RAGENV
      RAG_HOST=127.0.0.1
      RAG_PORT=${RAG_PORT}
      VECTOR_DB_TYPE=pgvector
      DB_HOST=127.0.0.1
      DB_PORT=${VECTOR_DB_PORT}
      POSTGRES_DB=${VECTOR_DB_NAME}
      POSTGRES_USER=${VECTOR_DB_USER}
      POSTGRES_PASSWORD=${VECTOR_DB_PASS}
      # The vector extension is created by setup-pgvector.sh as the postgres
      # superuser; ${VECTOR_DB_USER} cannot CREATE EXTENSION, so skip it here.
      PGVECTOR_CREATE_EXTENSION=False
      # Must match LibreChat's JWT_SECRET — the RAG API only verifies tokens
      # that LibreChat signed.
      JWT_SECRET=${JWT_SECRET}
      EMBEDDINGS_PROVIDER=${RAG_EMBED_PROVIDER}
      EMBEDDINGS_MODEL=${RAG_EMBED_MODEL}
      RAG_OPENAI_API_KEY=${OPENAI_API_KEY}
      RAG_UPLOAD_DIR=${RAG_DIR}/uploads
      COLLECTION_NAME=librechat
      NLTK_DATA=${RAG_DIR}/nltk_data
      SCARF_NO_ANALYTICS=true
      RAGENV
      chown root:ragapi /etc/rag-api.env
      chmod 640 /etc/rag-api.env

      chown -R ragapi:ragapi "${RAG_DIR}"

      log "Starting RAG API..."
      systemctl daemon-reload
      systemctl enable rag-api
      systemctl restart rag-api

      RAG_READY=0
      for _i in $(seq 1 30); do
        if curl -sf -o /dev/null "http://127.0.0.1:${RAG_PORT}/docs" 2>/dev/null \
           || curl -sf -o /dev/null "http://127.0.0.1:${RAG_PORT}/health" 2>/dev/null; then
          RAG_READY=1
          log "RAG API is up on port ${RAG_PORT}."
          break
        fi
        log "  attempt ${_i}/30 ..."
        sleep 5
      done
      if [ "${RAG_READY}" -eq 0 ]; then
        log "WARN: RAG API did not answer on ${RAG_PORT} — check journalctl -u rag-api"
        exit 1
      fi

      log "RAG API setup complete (provider=${RAG_EMBED_PROVIDER})."

  # --------------------------------------------------------------------------
  # (r) Main bootstrap script
  # --------------------------------------------------------------------------
  - path: /root/librechat-npm-bootstrap.sh
    permissions: '0700'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      set -x
      exec > >(tee -a /var/log/librechat-npm-bootstrap.log) 2>&1

      # --- repair corrupted base-image postfix (missing /etc/postfix/postfix-files
      #     makes postfix@-.service fail every boot); guarded no-op otherwise.
      #     dpkg --reinstall won't recreate it (treated as a removed conffile),
      #     so restore the file straight from the cached/downloaded .deb. ---
      if command -v dpkg >/dev/null 2>&1 && dpkg -s postfix >/dev/null 2>&1 && [ ! -f /etc/postfix/postfix-files ]; then
        echo "Repairing corrupted postfix (restoring /etc/postfix/postfix-files from .deb)..."
        _pf_deb="$(ls -t /var/cache/apt/archives/postfix_*.deb 2>/dev/null | head -1)"
        if [ -z "$_pf_deb" ]; then
          ( cd /tmp && DEBIAN_FRONTEND=noninteractive apt-get download postfix >/dev/null 2>&1 || true )
          _pf_deb="$(ls -t /tmp/postfix_*.deb 2>/dev/null | head -1)"
        fi
        [ -n "$_pf_deb" ] && dpkg-deb --fsys-tarfile "$_pf_deb" | tar -C / -xf - ./etc/postfix/postfix-files ./etc/postfix/postfix-files.d 2>/dev/null || true
        systemctl reset-failed 'postfix@-.service' 2>/dev/null || true
        systemctl restart 'postfix@-.service' 2>/dev/null || systemctl restart postfix 2>/dev/null || true
      fi

      source /root/.librechat-npm-bootstrap.env

      # Defaults for keys that may be missing from an env file written by an
      # older revision of this template. Without these, `set -u` would abort the
      # whole bootstrap on a re-run rather than just using the stock port.
      MONGO_PORT="${MONGO_PORT:-27017}"
      MEILI_PORT="${MEILI_PORT:-7700}"
      VECTOR_DB_PORT="${VECTOR_DB_PORT:-5432}"
      REDIS_PORT="${REDIS_PORT:-6379}"
      SEARXNG_PORT="${SEARXNG_PORT:-8888}"
      SD_WEBUI_PORT="${SD_WEBUI_PORT:-7860}"
      RAG_PORT="${RAG_PORT:-8000}"

      # --------------------------------------------------------------------------
      # SIGPIPE-safe random generators
      # --------------------------------------------------------------------------
      rand()    { LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom 2>/dev/null | head -c 24 || true; }
      rand_hex(){ LC_ALL=C tr -dc 'a-f0-9'    </dev/urandom 2>/dev/null | head -c 64 || true; }

      log() { echo "[librechat-npm-bootstrap] $(date -u '+%Y-%m-%dT%H:%M:%SZ') $*"; }

      # Write a value back into the operator env file. Values there are QUOTED
      # ("CHANGE_ME"), so a naive s|^KEY=CHANGE_ME|...| never matches and the
      # generated secret is silently lost — on the next run everything would be
      # regenerated and Mongo auth / JWT sessions would break. Match the whole
      # line instead, and escape sed metacharacters in the replacement so a
      # provisioner password containing & | or \ cannot corrupt the file.
      persist() {
        local _k="$1" _v="$2" _esc
        _esc="$(printf '%s' "${_v}" | sed -e 's/[&|\\]/\\&/g')"
        sed -i "s|^${_k}=.*|${_k}=\"${_esc}\"|" /root/.librechat-npm-bootstrap.env
      }

      log "=== LibreChat (npm) bootstrap started ==="

      # --------------------------------------------------------------------------
      # Provisioner-supplied admin credentials
      #
      # The provisioner exports VPS_ADMIN_EMAIL / VPS_ADMIN_PASS (and/or drops
      # them in /etc/vps-provision.env). These are the credentials the customer
      # is handed, so they must become the LibreChat login and the Let's Encrypt
      # contact. This runs BEFORE the CHANGE_ME generation below so a supplied
      # password is kept verbatim instead of being replaced by a random one.
      # Machine-only secrets (JWT, Mongo admin, Meili key, vector DB) are never
      # taken from here — they stay generated.
      # --------------------------------------------------------------------------
      [ -r /etc/vps-provision.env ] && . /etc/vps-provision.env
      if [ -n "${VPS_ADMIN_EMAIL:-}" ]; then
        LIBRECHAT_ADMIN_EMAIL="${VPS_ADMIN_EMAIL}"
        LE_EMAIL="${VPS_ADMIN_EMAIL}"
        log "Using provisioner-supplied admin email."
      fi
      if [ -n "${VPS_ADMIN_PASS:-}" ]; then
        LIBRECHAT_ADMIN_PASS="${VPS_ADMIN_PASS}"
        log "Using provisioner-supplied admin password."
      fi
      # The provisioner also supplies VPS_HOSTNAME / VPS_IP. If APP_DOMAIN is
      # still the stock placeholder, adopt one of those: LibreChat builds
      # DOMAIN_CLIENT / DOMAIN_SERVER from it (used for generated links, CORS and
      # email callbacks) and nginx uses it for server_name, so leaving it as
      # "example.com" produces an app that points at somebody else's domain.
      case "${APP_DOMAIN}" in
        ""|CHANGE_ME|example.com)
          if [ -n "${VPS_HOSTNAME:-}" ]; then
            APP_DOMAIN="${VPS_HOSTNAME}"
            log "APP_DOMAIN unset — using provisioner hostname: ${APP_DOMAIN}"
          elif [ -n "${VPS_IP:-}" ]; then
            APP_DOMAIN="${VPS_IP}"
            log "APP_DOMAIN unset — using provisioner IP: ${APP_DOMAIN}"
          fi
          ;;
      esac

      # Persist whatever we settled on so re-runs and operators see the same values
      persist LIBRECHAT_ADMIN_EMAIL "${LIBRECHAT_ADMIN_EMAIL}"
      persist LE_EMAIL "${LE_EMAIL}"
      persist APP_DOMAIN "${APP_DOMAIN}"

      # Let's Encrypt can only issue for a real DNS name — not a bare IP and not
      # a dotless hostname. Requires a letters-only TLD, which excludes IPv4.
      APP_DOMAIN_IS_FQDN=0
      if printf '%s' "${APP_DOMAIN}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.-]*\.[A-Za-z]{2,}$'; then
        APP_DOMAIN_IS_FQDN=1
      fi

      # --------------------------------------------------------------------------
      # Auto-generate secrets for any value still set to CHANGE_ME
      #
      # These are machine-only credentials the customer never types. Each is
      # written back to the env file so a second run of this script reuses them
      # rather than rotating them out from under the running services.
      # --------------------------------------------------------------------------
      if [ "${JWT_SECRET}" = "CHANGE_ME" ]; then
        JWT_SECRET="$(rand_hex)"
        persist JWT_SECRET "${JWT_SECRET}"
      fi
      if [ "${JWT_REFRESH_SECRET}" = "CHANGE_ME" ]; then
        JWT_REFRESH_SECRET="$(rand_hex)"
        persist JWT_REFRESH_SECRET "${JWT_REFRESH_SECRET}"
      fi
      if [ "${CREDS_KEY}" = "CHANGE_ME" ]; then
        CREDS_KEY="$(rand_hex)"
        persist CREDS_KEY "${CREDS_KEY}"
      fi
      if [ "${CREDS_IV}" = "CHANGE_ME" ]; then
        CREDS_IV="$(LC_ALL=C tr -dc 'a-f0-9' </dev/urandom 2>/dev/null | head -c 32 || true)"
        persist CREDS_IV "${CREDS_IV}"
      fi
      if [ "${MONGO_ADMIN_PASS}" = "CHANGE_ME" ]; then
        MONGO_ADMIN_PASS="$(rand)"
        persist MONGO_ADMIN_PASS "${MONGO_ADMIN_PASS}"
      fi
      if [ "${MEILI_MASTER_KEY}" = "CHANGE_ME" ]; then
        MEILI_MASTER_KEY="$(rand_hex)"
        persist MEILI_MASTER_KEY "${MEILI_MASTER_KEY}"
      fi
      if [ "${VECTOR_DB_PASS}" = "CHANGE_ME" ]; then
        VECTOR_DB_PASS="$(rand)"
        persist VECTOR_DB_PASS "${VECTOR_DB_PASS}"
      fi

      # The customer-facing login password: provisioner value wins, otherwise
      # generate one. Either way persist it — it is printed in the credentials
      # file and used to create the LibreChat account in step 18b.
      if [ "${LIBRECHAT_ADMIN_PASS}" = "CHANGE_ME" ]; then
        LIBRECHAT_ADMIN_PASS="$(rand)"
      fi
      persist LIBRECHAT_ADMIN_PASS "${LIBRECHAT_ADMIN_PASS}"

      # --------------------------------------------------------------------------
      # 1. Disable Transparent Huge Pages (MongoDB requirement)
      # --------------------------------------------------------------------------
      log "Disabling Transparent Huge Pages..."
      systemctl daemon-reload
      systemctl enable --now disable-thp.service || true
      if [ -f /sys/kernel/mm/transparent_hugepage/enabled ]; then
        echo never > /sys/kernel/mm/transparent_hugepage/enabled
      fi
      if [ -f /sys/kernel/mm/transparent_hugepage/defrag ]; then
        echo never > /sys/kernel/mm/transparent_hugepage/defrag
      fi

      # --------------------------------------------------------------------------
      # 2. Apply sysctl tunings
      # --------------------------------------------------------------------------
      log "Applying sysctl tunings..."
      sysctl --system -q

      # --------------------------------------------------------------------------
      # 3. Node.js v24 via NodeSource (LibreChat requires v24 specifically)
      # --------------------------------------------------------------------------
      log "Installing Node.js 24 via NodeSource..."
      if ! command -v node >/dev/null 2>&1 || ! node --version 2>/dev/null | grep -q "^v24"; then
        # NOTE: do NOT pipe the NodeSource script to `bash -`. Run from stdin,
        # its internal `configure_repo` -> apt/gpg steps consume the remaining
        # script bytes off stdin, truncating the source mid-token. Download to
        # a file and execute with stdin detached.
        curl -fsSL "https://deb.nodesource.com/setup_24.x" -o /tmp/nodesource_setup.sh
        bash /tmp/nodesource_setup.sh </dev/null
        rm -f /tmp/nodesource_setup.sh
        apt-get install -y nodejs </dev/null
      else
        log "Node.js already installed: $(node --version)"
      fi
      log "Node.js: $(node --version)  npm: $(npm --version)"

      # --------------------------------------------------------------------------
      # 4. MongoDB Community 8.0 via official apt repo (host service, not container)
      # --------------------------------------------------------------------------
      log "Installing MongoDB Community 8.0..."

      MONGO_KEYRING="/usr/share/keyrings/mongodb-server-8.0.gpg"

      if [ ! -f "${MONGO_KEYRING}" ]; then
        curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
          | gpg --dearmor -o "${MONGO_KEYRING}"
      fi

      # Use noble codename for MongoDB 8.0 repo (26.04 support via noble line)
      echo "deb [ arch=amd64,arm64 signed-by=${MONGO_KEYRING} ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" \
        > /etc/apt/sources.list.d/mongodb-org-8.0.list

      apt-get update -qq

      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        mongodb-org \
        mongodb-org-database \
        mongodb-org-tools \
        mongodb-mongosh

      # Pin MongoDB packages to prevent accidental version upgrades
      for _pkg in mongodb-org mongodb-org-database mongodb-org-mongos mongodb-org-server mongodb-org-shell mongodb-org-tools; do
        echo "${_pkg} hold" | dpkg --set-selections 2>/dev/null || true
      done

      # --------------------------------------------------------------------------
      # 5. Configure MongoDB (mongod.conf — YAML, column-0 keys required)
      # --------------------------------------------------------------------------
      log "Configuring MongoDB..."
      {
      echo "# mongod.conf — generated by librechat-npm-bootstrap.sh"
      echo "storage:"
      echo "  dbPath: /var/lib/mongodb"
      echo "  wiredTiger:"
      echo "    engineConfig:"
      echo "      cacheSizeGB: 1"
      echo "systemLog:"
      echo "  destination: file"
      echo "  logAppend: true"
      echo "  path: /var/log/mongodb/mongod.log"
      echo "net:"
      echo "  port: ${MONGO_PORT}"
      echo "  bindIp: 127.0.0.1"
      echo "processManagement:"
      echo "  timeZoneInfo: /usr/share/zoneinfo"
      echo "security:"
      echo "  authorization: disabled"
      } > /etc/mongod.conf

      # Ensure data + log directories exist with correct ownership
      mkdir -p /var/lib/mongodb /var/log/mongodb
      chown -R mongodb:mongodb /var/lib/mongodb /var/log/mongodb

      systemctl daemon-reload
      systemctl enable mongod
      systemctl start mongod || log "WARN: mongod start returned non-zero — check journalctl -u mongod"

      # Wait up to 90 seconds for mongod to become responsive (no auth yet)
      log "Waiting for MongoDB to start (no auth)..."
      MONGO_READY=0
      for _i in $(seq 1 18); do
        if mongosh --quiet --port "${MONGO_PORT}" --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
          MONGO_READY=1
          log "MongoDB is up (no auth)."
          break
        fi
        log "  attempt ${_i}/18 ..."
        sleep 5
      done
      if [ "${MONGO_READY}" -eq 0 ]; then
        log "WARN: MongoDB not responding after 90s — check journalctl -u mongod"
      fi

      # --------------------------------------------------------------------------
      # 6. Create MongoDB admin user with random password
      # --------------------------------------------------------------------------
      if [ "${MONGO_READY}" -eq 1 ] && mongosh --quiet --port "${MONGO_PORT}" \
             --username "${MONGO_ADMIN_USER}" --password "${MONGO_ADMIN_PASS}" \
             --authenticationDatabase admin --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
        # Re-run against a host where step 7 already switched auth on: the
        # persisted credentials work, so there is nothing to create. Without
        # this the unauthenticated getUser() below is rejected and the run
        # reports a misleading "admin user creation returned non-zero".
        log "MongoDB admin user already present and credentials valid — skipping."
      elif [ "${MONGO_READY}" -eq 1 ]; then
        log "Creating MongoDB admin user..."
        # Write the init script to a file, substitute the real credentials into
        # it, THEN run it. The heredoc delimiter is quoted so that nothing here
        # is expanded by the shell (which would leak the password into `set -x`
        # output); the sed pass below is what injects the real values.
        # `use admin` is a REPL-only helper and is not valid in a script file —
        # getSiblingDB() is the scripted equivalent.
        cat > /tmp/mongo-init.js <<-'MONGOJS'
      var adminDb = db.getSiblingDB("admin");
      if (adminDb.getUser("MONGO_ADMIN_USER_PLACEHOLDER") === null) {
        adminDb.createUser({
          user: "MONGO_ADMIN_USER_PLACEHOLDER",
          pwd:  "MONGO_ADMIN_PASS_PLACEHOLDER",
          roles: [
            { role: "userAdminAnyDatabase", db: "admin" },
            { role: "readWriteAnyDatabase", db: "admin" },
            { role: "dbAdminAnyDatabase",   db: "admin" },
            { role: "clusterAdmin",         db: "admin" }
          ]
        });
        print("Admin user created.");
      } else {
        print("Admin user already exists — skipping.");
      }
      MONGOJS
        chmod 600 /tmp/mongo-init.js
        sed -i "s|MONGO_ADMIN_USER_PLACEHOLDER|${MONGO_ADMIN_USER}|g" /tmp/mongo-init.js
        sed -i "s|MONGO_ADMIN_PASS_PLACEHOLDER|${MONGO_ADMIN_PASS}|g" /tmp/mongo-init.js
        mongosh --quiet --port "${MONGO_PORT}" /tmp/mongo-init.js \
          || log "WARN: MongoDB admin user creation returned non-zero"
        rm -f /tmp/mongo-init.js
      else
        log "WARN: Skipping admin user creation — mongod not ready"
      fi

      # --------------------------------------------------------------------------
      # 7. Enable MongoDB authentication and restart
      # --------------------------------------------------------------------------
      log "Enabling MongoDB authentication..."
      sed -i 's/authorization: disabled/authorization: enabled/' /etc/mongod.conf
      systemctl restart mongod || log "WARN: mongod restart returned non-zero"

      # Wait for authenticated mongod to start
      log "Waiting for authenticated mongod..."
      for _i in $(seq 1 12); do
        if mongosh --quiet \
              --port "${MONGO_PORT}" \
              --username "${MONGO_ADMIN_USER}" \
              --password "${MONGO_ADMIN_PASS}" \
              --authenticationDatabase "admin" \
              --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
          log "MongoDB is up with authentication enabled."
          break
        fi
        log "  restart attempt ${_i}/12 ..."
        sleep 5
      done

      # --------------------------------------------------------------------------
      # 8. Create LibreChat database in MongoDB
      # --------------------------------------------------------------------------
      log "Creating LibreChat MongoDB database..."
      # `use <db>` is a REPL helper and is a syntax error inside --eval; use
      # getSiblingDB(). MongoDB creates a database lazily, so touch a collection
      # to make it materialise.
      mongosh --quiet \
        --port "${MONGO_PORT}" \
        --username "${MONGO_ADMIN_USER}" \
        --password "${MONGO_ADMIN_PASS}" \
        --authenticationDatabase "admin" \
        --eval "db.getSiblingDB('${MONGO_DB_NAME}').createCollection('_bootstrap'); print('Database ${MONGO_DB_NAME} ready.');" \
        || log "WARN: could not pre-create ${MONGO_DB_NAME} — LibreChat will create it on first write"

      # --------------------------------------------------------------------------
      # 9. Install PostgreSQL 16 + pgvector (RAG vector database)
      # --------------------------------------------------------------------------
      log "Setting up PostgreSQL 16 + pgvector..."
      bash /root/setup-pgvector.sh

      # --------------------------------------------------------------------------
      # 9b. RAG API — LibreChat's file-upload / retrieval backend.
      #
      # Needs the pgvector database above, so it runs immediately after. Optional
      # component: a failure here costs file uploads, not the whole boot.
      # --------------------------------------------------------------------------
      log "Setting up RAG API..."
      bash /root/setup-rag-api.sh \
        || log "WARN: RAG API setup failed — file uploads/retrieval will be unavailable"

      # --------------------------------------------------------------------------
      # 10. Install Meilisearch 1.35 (host service for search/RAG)
      # --------------------------------------------------------------------------
      log "Installing Meilisearch 1.35.1..."

      # Create meilisearch user and data directories.
      # -U so the matching group exists; Group=meilisearch in the unit and the
      # chown below both depend on it. (No supplementary groups needed — it only
      # ever touches its own data dir.)
      id meilisearch &>/dev/null || useradd --system -U --shell /usr/sbin/nologin --home-dir /var/lib/meilisearch meilisearch
      # The database MUST live in its own subdirectory. MEILI_DB_PATH is scanned
      # at startup to infer the DB version, so if dumps/ and snapshots/ sit
      # directly inside it Meilisearch aborts with "failed to infer the version
      # of the database" and crash-loops. This mirrors upstream's own default
      # layout (db_path = "./data.ms" alongside dumps/ and snapshots/).
      mkdir -p /var/lib/meilisearch/data.ms /var/lib/meilisearch/dumps /var/lib/meilisearch/snapshots
      chown -R meilisearch:meilisearch /var/lib/meilisearch

      # ------------------------------------------------------------------------
      # Download the Meilisearch binary.
      #
      # Version is pinned to match what LibreChat itself ships
      # (getmeili/meilisearch:v1.35.1 in its docker-compose). Meilisearch's index
      # format is version-specific — upstream even namespaces its data volume by
      # version — so do NOT bump this independently of LibreChat.
      # ------------------------------------------------------------------------
      MEILI_VERSION="1.35.1"
      case "$(uname -m)" in
        x86_64)          MEILI_ARCH="linux-amd64" ;;
        aarch64|arm64)   MEILI_ARCH="linux-aarch64" ;;
        *)               MEILI_ARCH="linux-amd64"
                         log "WARN: unrecognised arch $(uname -m) — trying linux-amd64" ;;
      esac

      # Re-download when missing OR when the on-disk binary is a different
      # version; a plain [ ! -f ] guard would pin the host to whatever landed
      # first, including a truncated file from a failed download.
      MEILI_HAVE=""
      if [ -x /usr/local/bin/meilisearch ]; then
        MEILI_HAVE="$(/usr/local/bin/meilisearch --version 2>/dev/null | awk '{print $NF}' || true)"
      fi
      if [ "${MEILI_HAVE}" != "${MEILI_VERSION}" ]; then
        log "Downloading Meilisearch v${MEILI_VERSION} (${MEILI_ARCH})..."
        # Stage in a temp file so an interrupted transfer can never leave a
        # half-written binary sitting at the final path.
        _meili_tmp="$(mktemp /tmp/meilisearch.XXXXXX)"
        if curl -fsSL --retry 3 --retry-delay 2 \
             "https://github.com/meilisearch/meilisearch/releases/download/v${MEILI_VERSION}/meilisearch-${MEILI_ARCH}" \
             -o "${_meili_tmp}"; then
          chmod 0755 "${_meili_tmp}"
          if "${_meili_tmp}" --version >/dev/null 2>&1; then
            mv -f "${_meili_tmp}" /usr/local/bin/meilisearch
            chown root:root /usr/local/bin/meilisearch
            log "Meilisearch binary installed: $(/usr/local/bin/meilisearch --version 2>&1 | head -1)"
          else
            rm -f "${_meili_tmp}"
            log "WARN: downloaded Meilisearch binary would not execute (wrong arch?) — search will be unavailable"
          fi
        else
          rm -f "${_meili_tmp}"
          log "WARN: Meilisearch download failed — search will be unavailable"
        fi
      else
        log "Meilisearch v${MEILI_VERSION} already installed."
      fi

      # Write Meilisearch environment file with master key.
      # systemd reads EnvironmentFile as root before dropping to User=, so 0600
      # root:root is correct here and keeps the master key unreadable otherwise.
      cat > /etc/meilisearch.env <<-'MEILIEV'
      MEILI_MASTER_KEY=MEILI_MASTER_KEY_PLACEHOLDER
      MEILI_DB_PATH=/var/lib/meilisearch/data.ms
      MEILI_ENV=production
      MEILI_HTTP_ADDR=127.0.0.1:MEILI_PORT_PLACEHOLDER
      MEILI_NO_ANALYTICS=true
      MEILI_DUMP_DIR=/var/lib/meilisearch/dumps
      MEILI_SNAPSHOT_DIR=/var/lib/meilisearch/snapshots
      MEILIEV
      sed -i "s|MEILI_MASTER_KEY_PLACEHOLDER|${MEILI_MASTER_KEY}|" /etc/meilisearch.env
      sed -i "s|MEILI_PORT_PLACEHOLDER|${MEILI_PORT}|" /etc/meilisearch.env
      chmod 600 /etc/meilisearch.env
      chown root:root /etc/meilisearch.env

      # Enable and start Meilisearch (only if the binary actually made it down —
      # enabling a unit whose ExecStart is missing just produces a boot failure
      # loop on every subsequent reboot).
      if [ -x /usr/local/bin/meilisearch ]; then
        log "Starting Meilisearch service..."
        systemctl daemon-reload
        systemctl enable meilisearch
        systemctl restart meilisearch || log "WARN: meilisearch start returned non-zero — check journalctl -u meilisearch"

        # Wait for Meilisearch to be ready (/health needs no auth)
        MEILI_READY=0
        for _i in $(seq 1 10); do
          if curl -sf "http://127.0.0.1:${MEILI_PORT}/health" >/dev/null 2>&1; then
            MEILI_READY=1
            log "Meilisearch is up."
            break
          fi
          log "  attempt ${_i}/10 ..."
          sleep 3
        done
        if [ "${MEILI_READY}" -eq 0 ]; then
          log "WARN: Meilisearch not responding on ${MEILI_PORT} — check journalctl -u meilisearch"
        fi
      else
        log "WARN: /usr/local/bin/meilisearch missing — skipping service start"
      fi

      # --------------------------------------------------------------------------
      # 11. Create librechat system user (already created via cloud-init users block,
      #    but ensure it exists and has correct settings)
      # --------------------------------------------------------------------------
      log "Ensuring librechat user exists and has /opt/librechat directory..."
      # No sudo group: this is a service account, and both `sudo -u librechat`
      # calls later in this script run as root, so it needs no privileges of its own.
      id librechat &>/dev/null || useradd --system --shell /bin/bash --home-dir /opt/librechat --groups www-data librechat
      mkdir -p /opt/librechat
      chown -R librechat:librechat /opt/librechat

      # --------------------------------------------------------------------------
      # 12. Clone LibreChat from GitHub
      # --------------------------------------------------------------------------
      log "Cloning LibreChat from GitHub..."
      # The checkout is owned by librechat but git runs here as root, which trips
      # git's "detected dubious ownership" guard and would break the pull path on
      # every re-run. Allow it explicitly.
      git config --global --add safe.directory "${LIBRECHAT_DIR}" 2>/dev/null || true
      if [ -d "${LIBRECHAT_DIR}/.git" ]; then
        log "LibreChat already cloned — pulling latest..."
        git -C "${LIBRECHAT_DIR}" pull --ff-only || log "WARN: git pull had issues — continuing"
      else
        # ${LIBRECHAT_DIR} is the librechat user's home, so cloud-init has
        # already seeded it from /etc/skel (.bashrc, .profile, .ssh) and
        # `git clone` refuses a non-empty destination. Clone to a scratch dir
        # and move the tree in, which also tolerates a half-finished earlier run.
        _lc_src="$(mktemp -d /tmp/librechat-src.XXXXXX)"
        rm -rf "${_lc_src}"
        git clone --depth 1 https://github.com/danny-avila/LibreChat.git "${_lc_src}"
        cp -a "${_lc_src}/." "${LIBRECHAT_DIR}/"
        rm -rf "${_lc_src}"
      fi

      chown -R librechat:librechat "${LIBRECHAT_DIR}"

      # Install bun for LibreChat monorepo builds (@librechat/data-schemas)
      export HOME=/root
      if ! command -v bun &>/dev/null; then
        log "Installing bun for LibreChat monorepo builds..."
        curl -fsSL https://bun.sh/install | BUN_INSTALL=/opt/bun bash 2>&1
      fi
      export BUN_INSTALL="/opt/bun"
      export PATH="$BUN_INSTALL/bin:$PATH"
      if [ -f "${LIBRECHAT_DIR}/package.json" ] && grep -q '"b:data-schemas"' "${LIBRECHAT_DIR}/package.json" 2>/dev/null; then
        log "Building @librechat/data-schemas with bun..."
        cd "${LIBRECHAT_DIR}" && bun install 2>&1 || bun install 2>&1
        cd "${LIBRECHAT_DIR}" && bun run b:data-schemas 2>&1 | tail -10
      fi

      # --------------------------------------------------------------------------
      # 13. Redis (cache + session store for LibreChat)
      # --------------------------------------------------------------------------
      log "Setting up Redis..."
      id -u redis &>/dev/null || useradd --system --home /var/lib/redis --shell /usr/sbin/nologin --comment "Redis In-Memory Data Store" redis
      mkdir -p /var/lib/redis /var/log/redis /etc/redis
      chown redis:redis /var/lib/redis /var/log/redis
      chmod 750 /var/lib/redis /var/log/redis
      touch /var/log/redis/redis.log
      chown redis:redis /var/log/redis/redis.log
      # Install redis-server before enabling the service.
      # --force-confold keeps the /etc/redis/redis.conf written by write_files;
      # --force-confnew would replace it with the packaged default and silently
      # drop the maxmemory/eviction tuning below.
      DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::="--force-confold" redis-server
      sed -i "s|^port REDIS_PORT_PLACEHOLDER|port ${REDIS_PORT}|" /etc/redis/redis.conf
      # The package ships its own redis-server.service and starts it on install.
      # It would hold 127.0.0.1:6379 and our redis.service would fail to bind.
      # Mask rather than merely disable: a disabled unit can still be pulled in
      # as a dependency, fail to bind the port ours already owns, and sit in the
      # failed state forever.
      systemctl disable --now redis-server 2>/dev/null || true
      systemctl mask redis-server 2>/dev/null || true
      systemctl reset-failed redis-server 2>/dev/null || true
      systemctl daemon-reload
      systemctl enable redis
      systemctl start redis || log "WARN: redis start returned non-zero — check journalctl -u redis"
      # Verify
      REDIS_READY=0
      for _i in $(seq 1 10); do
        if redis-cli -h 127.0.0.1 -p "${REDIS_PORT}" ping 2>/dev/null | grep -q PONG; then
          REDIS_READY=1
          log "Redis is running."
          break
        fi
        log "  redis attempt ${_i}/10 ..."
        sleep 2
      done
      if [ "${REDIS_READY}" -eq 0 ]; then
        log "WARN: Redis not responding on ${REDIS_PORT} — check journalctl -u redis"
      fi

      # --------------------------------------------------------------------------
      # 13a. SearXNG (self-hosted web search backend for LibreChat)
      #
      # Optional component: run in its own script so that a failure logs a
      # warning and the rest of the stack still comes up.
      # --------------------------------------------------------------------------
      log "Setting up SearXNG..."
      bash /root/setup-searxng.sh \
        || log "WARN: SearXNG setup failed — continuing without web search (see /var/log/librechat-npm-bootstrap.log)"

      # --------------------------------------------------------------------------
      # 13b. Miniconda (Python 3.10 for Stable Diffusion WebUI)
      # --------------------------------------------------------------------------
      log "Installing Miniconda..."
      if [ ! -d /opt/miniconda ]; then
        export HOME=/root
        cd /tmp
        curl -fsSL https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -o miniconda.sh
        bash miniconda.sh -b -p /opt/miniconda 2>&1 | tail -3
        rm miniconda.sh
      fi
      # Make conda available on PATH after Miniconda installation
      source /opt/miniconda/etc/profile.d/conda.sh 2>/dev/null || true
      # Accept Anaconda ToS on Ubuntu 24.04
      /opt/miniconda/bin/conda tos accept || true
      # Create Python 3.10 environment for SD WebUI
      if ! /opt/miniconda/envs/sd/bin/python --version 2>&1 | grep -q "Python 3.10"; then
        /opt/miniconda/bin/conda create -y -n sd python=3.10 -q 2>&1 | tail -5
      fi
      # Pre-install torch CPU
      if ! /opt/miniconda/envs/sd/bin/python -c "import torch" 2>/dev/null; then
        /opt/miniconda/envs/sd/bin/pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -3
      fi
      # Ensure setuptools and wheel are installed (needed for CLIP and other pip packages)
      /opt/miniconda/envs/sd/bin/pip install --quiet setuptools wheel 2>&1 | tail -3
      log "Miniconda Python 3.10 environment ready."

      # --------------------------------------------------------------------------
      # --------------------------------------------------------------------------
      # --------------------------------------------------------------------------
      # 13c. Stable Diffusion WebUI (A1111 fork)
      # --------------------------------------------------------------------------
      log "Fixing pkg_resources for Stable Diffusion..."
      /opt/miniconda/envs/sd/bin/pip install --upgrade setuptools wheel 2>&1 | tail -3
      log "Cloning/installing Stable Diffusion WebUI..."
      if [ ! -d /opt/stable-diffusion-webui/.git ]; then
        rm -rf /opt/stable-diffusion-webui
        git clone --depth=1 https://github.com/AUTOMATIC1111/stable-diffusion-webui.git /opt/stable-diffusion-webui
        rm -rf /opt/stable-diffusion-webui/venv
      fi
      # Make webui-user.sh executable
      chmod +x /opt/webui-user.sh
      # Ensure stablediffusion user exists
      id -u stablediffusion &>/dev/null || useradd --system --home /opt/stable-diffusion-webui --shell /usr/sbin/nologin stablediffusion
      chown -R stablediffusion:stablediffusion /opt/stable-diffusion-webui
      # Enable SD service (it won't start until first model download, which is fine)
      systemctl enable stable-diffusion
      log "Stable Diffusion WebUI installed. First run will download models (~10-20 min)."

      # --------------------------------------------------------------------------
      # 14. Create .env from .env.example and add required overrides
      # --------------------------------------------------------------------------
      log "Configuring LibreChat .env..."

      # Authentication is enabled on mongod in step 7, so every client URI must
      # carry credentials and an authSource. rand() emits [A-Za-z0-9] only, so
      # the password needs no percent-encoding here.
      MONGO_URI="mongodb://${MONGO_ADMIN_USER}:${MONGO_ADMIN_PASS}@127.0.0.1:${MONGO_PORT}/${MONGO_DB_NAME}?authSource=admin"

      if [ -f "${LIBRECHAT_DIR}/.env.example" ]; then
        cp -f "${LIBRECHAT_DIR}/.env.example" "${LIBRECHAT_DIR}/.env"
      else
        : > "${LIBRECHAT_DIR}/.env"
      fi

      {
        echo ""
        echo "# ---- generated by librechat-npm-bootstrap.sh ----"
        echo "HOST=0.0.0.0"
        echo "PORT=${LIBRECHAT_PORT}"
        echo "JWT_SECRET=${JWT_SECRET}"
        echo "JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}"
        echo "CREDS_KEY=${CREDS_KEY}"
        echo "CREDS_IV=${CREDS_IV}"
        echo "MONGO_URI=${MONGO_URI}"
        echo "ALLOW_REGISTRATION=true"
        echo "ALLOW_SOCIAL_LOGIN=false"
        echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
        echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
        echo "DOMAIN_CLIENT=http://${APP_DOMAIN:-localhost}"
        echo "DOMAIN_SERVER=http://${APP_DOMAIN:-localhost}"
        echo "APP_TITLE=LibreChat"
        echo "# Meilisearch (search/RAG) — SEARCH=true is the master switch;"
        echo "# without it LibreChat ignores MEILI_HOST entirely."
        echo "SEARCH=true"
        echo "MEILI_NO_ANALYTICS=true"
        echo "MEILI_HOST=http://127.0.0.1:${MEILI_PORT}"
        echo "MEILI_MASTER_KEY=${MEILI_MASTER_KEY}"
        echo "# RAG API (file uploads / retrieval) backed by pgvector"
        echo "RAG_API_URL=http://127.0.0.1:${RAG_PORT}"
        echo "RAG_PORT=${RAG_PORT}"
        echo "VECTOR_DB_HOST=127.0.0.1"
        echo "VECTOR_DB_PORT=${VECTOR_DB_PORT}"
        echo "VECTOR_DB_NAME=${VECTOR_DB_NAME}"
        echo "VECTOR_DB_USER=${VECTOR_DB_USER}"
        echo "VECTOR_DB_PASS=${VECTOR_DB_PASS}"
        echo "# Redis (cache/sessions)"
        echo "USE_REDIS=true"
        echo "REDIS_URI=redis://127.0.0.1:${REDIS_PORT}"
        echo "# Stable Diffusion API"
        echo "SD_WEBUI_URL=http://127.0.0.1:${SD_WEBUI_PORT}"
        echo "# SearXNG (web search provider — LibreChat reads SEARXNG_INSTANCE_URL)"
        echo "SEARXNG_INSTANCE_URL=http://127.0.0.1:${SEARXNG_PORT}"
      } >> "${LIBRECHAT_DIR}/.env"

      chmod 600 "${LIBRECHAT_DIR}/.env"
      chown librechat:librechat "${LIBRECHAT_DIR}/.env"

      # --------------------------------------------------------------------------
      # 14b. librechat.yaml — the app config (separate from .env)
      #
      # Without this file every start logs
      #   "Config file YAML format is invalid: ENOENT ... librechat.yaml"
      # and the web-search tool has nothing to bind SearXNG to. Seed it from the
      # checked-in example so `version:` always matches the cloned release
      # rather than a number hardcoded here that drifts.
      # --------------------------------------------------------------------------
      log "Writing librechat.yaml..."
      if [ -f "${LIBRECHAT_DIR}/librechat.example.yaml" ]; then
        cp -f "${LIBRECHAT_DIR}/librechat.example.yaml" "${LIBRECHAT_DIR}/librechat.yaml"
      else
        printf 'version: 1.3.13\ncache: true\n' > "${LIBRECHAT_DIR}/librechat.yaml"
      fi
      if ! grep -q '^webSearch:' "${LIBRECHAT_DIR}/librechat.yaml"; then
        {
          echo ""
          echo "# --- appended by librechat-npm-bootstrap.sh ---"
          echo "# Point the web-search tool at the local SearXNG instance."
          echo "# \${SEARXNG_INSTANCE_URL} is resolved from the environment at runtime."
          echo "webSearch:"
          echo "  searxngInstanceUrl: \"\${SEARXNG_INSTANCE_URL}\""
        } >> "${LIBRECHAT_DIR}/librechat.yaml"
      fi
      chown librechat:librechat "${LIBRECHAT_DIR}/librechat.yaml"

      # --------------------------------------------------------------------------
      # 15. Write runtime environment file for systemd service
      # --------------------------------------------------------------------------
      log "Writing systemd environment file..."
      cat > /etc/librechat.env <<-'ENVFILE'
      NODE_ENV=production
      HOST=0.0.0.0
      PORT=LIBRECHAT_PORT_PLACEHOLDER
      JWT_SECRET=JWT_SECRET_PLACEHOLDER
      JWT_REFRESH_SECRET=JWT_REFRESH_SECRET_PLACEHOLDER
      CREDS_KEY=CREDS_KEY_PLACEHOLDER
      CREDS_IV=CREDS_IV_PLACEHOLDER
      MONGO_URI=MONGO_URI_PLACEHOLDER
      OPENAI_API_KEY=OPENAI_API_KEY_PLACEHOLDER
      ANTHROPIC_API_KEY=ANTHROPIC_API_KEY_PLACEHOLDER
      SEARCH=true
      MEILI_NO_ANALYTICS=true
      MEILI_HOST=http://127.0.0.1:MEILI_PORT_PLACEHOLDER
      MEILI_MASTER_KEY=MEILI_MASTER_KEY_PLACEHOLDER
      VECTOR_DB_HOST=127.0.0.1
      VECTOR_DB_PORT=VECTOR_DB_PORT_PLACEHOLDER
      VECTOR_DB_NAME=VECTOR_DB_NAME_PLACEHOLDER
      VECTOR_DB_USER=VECTOR_DB_USER_PLACEHOLDER
      VECTOR_DB_PASS=VECTOR_DB_PASS_PLACEHOLDER
      USE_REDIS=true
      REDIS_URI=redis://127.0.0.1:REDIS_PORT_PLACEHOLDER
      SEARXNG_INSTANCE_URL=http://127.0.0.1:SEARXNG_PORT_PLACEHOLDER
      RAG_API_URL=http://127.0.0.1:RAG_PORT_PLACEHOLDER
      RAG_PORT=RAG_PORT_PLACEHOLDER
      ENVFILE
      # Substitute actual values
      sed -i "s|LIBRECHAT_PORT_PLACEHOLDER|${LIBRECHAT_PORT}|" /etc/librechat.env
      sed -i "s|MONGO_URI_PLACEHOLDER|${MONGO_URI}|" /etc/librechat.env
      sed -i "s|MEILI_PORT_PLACEHOLDER|${MEILI_PORT}|" /etc/librechat.env
      sed -i "s|VECTOR_DB_PORT_PLACEHOLDER|${VECTOR_DB_PORT}|" /etc/librechat.env
      sed -i "s|VECTOR_DB_NAME_PLACEHOLDER|${VECTOR_DB_NAME}|" /etc/librechat.env
      sed -i "s|VECTOR_DB_USER_PLACEHOLDER|${VECTOR_DB_USER}|" /etc/librechat.env
      sed -i "s|REDIS_PORT_PLACEHOLDER|${REDIS_PORT}|" /etc/librechat.env
      sed -i "s|SEARXNG_PORT_PLACEHOLDER|${SEARXNG_PORT}|" /etc/librechat.env
      sed -i "s|RAG_PORT_PLACEHOLDER|${RAG_PORT}|g" /etc/librechat.env
      sed -i "s|JWT_SECRET_PLACEHOLDER|${JWT_SECRET}|" /etc/librechat.env
      sed -i "s|JWT_REFRESH_SECRET_PLACEHOLDER|${JWT_REFRESH_SECRET}|" /etc/librechat.env
      sed -i "s|CREDS_KEY_PLACEHOLDER|${CREDS_KEY}|" /etc/librechat.env
      sed -i "s|CREDS_IV_PLACEHOLDER|${CREDS_IV}|" /etc/librechat.env
      sed -i "s|OPENAI_API_KEY_PLACEHOLDER|${OPENAI_API_KEY}|" /etc/librechat.env
      sed -i "s|ANTHROPIC_API_KEY_PLACEHOLDER|${ANTHROPIC_API_KEY}|" /etc/librechat.env
      sed -i "s|MEILI_MASTER_KEY_PLACEHOLDER|${MEILI_MASTER_KEY}|" /etc/librechat.env
      sed -i "s|VECTOR_DB_PASS_PLACEHOLDER|${VECTOR_DB_PASS}|" /etc/librechat.env
      chmod 600 /etc/librechat.env

      # --------------------------------------------------------------------------
      # 16. Install dependencies and build the frontend (as the librechat user)
      #
      # This replaces an earlier `npm run reinstall` piped through `head -5`.
      # Three separate faults made that build a no-op:
      #   * `| head -5` — head exits after five lines, the build takes SIGPIPE and
      #     dies in about a second. client/dist was never produced and the backend
      #     crash-looped on MODULE_NOT_FOUND: librechat-data-provider.
      #   * the nested `bash -c '... '\''${VAR}'\'' ...'` quoting: the preceding
      #     export HOME='...' lines flip quote parity, so every ${VAR} after them
      #     reached the inner shell as a LITERAL — including ${LIBRECHAT_DIR},
      #     which produced "cd: ${LIBRECHAT_DIR}: No such file or directory".
      #   * `npm run reinstall` is LibreChat's updater (node config/update.js),
      #     not the install path. `npm ci` + `npm run frontend` is what a fresh
      #     checkout needs, and `frontend` is exactly what builds the workspace
      #     packages the backend imports.
      # --------------------------------------------------------------------------
      log "Installing LibreChat dependencies and building the frontend (several minutes)..."

      NPM_CACHE="/opt/librechat/.npm-cache"
      mkdir -p "${NPM_CACHE}"
      chown -R librechat:librechat /opt/librechat

      # Run npm as the librechat user with an explicit environment. `env` keeps
      # expansion in THIS shell, so there is no nested-quoting parity to get
      # wrong. NODE_ENV is deliberately not "production" here: that would make
      # npm skip devDependencies and the client build needs vite. The service
      # sets NODE_ENV=production at runtime via /etc/librechat.env.
      lc_npm() {
        ( cd "${LIBRECHAT_DIR}" && sudo -u librechat -H env \
            HOME=/opt/librechat \
            npm_config_cache="${NPM_CACHE}" \
            npm_config_fund=false \
            npm_config_audit=false \
            npm_config_update_notifier=false \
            "$@" </dev/null )
      }

      # npm ci is reproducible but requires package.json and package-lock.json to
      # agree; fall back to npm install if the checkout ever drifts.
      lc_npm npm ci \
        || lc_npm npm install \
        || log "WARN: dependency install failed — LibreChat will not start"

      # Do NOT pipe this anywhere that can exit early (see above).
      lc_npm npm run frontend \
        || log "WARN: frontend build failed — the web UI may not load"

      if [ -d "${LIBRECHAT_DIR}/client/dist" ]; then
        log "Frontend build present at ${LIBRECHAT_DIR}/client/dist."
      else
        log "WARN: ${LIBRECHAT_DIR}/client/dist missing — the web UI will not render"
      fi

      # Re-assert ownership after npm operations
      chown -R librechat:librechat "${LIBRECHAT_DIR}"

      # --------------------------------------------------------------------------
      # 17. Configure Nginx reverse proxy
      # --------------------------------------------------------------------------
      log "Configuring Nginx reverse proxy..."
      sed -i "s|APP_DOMAIN_PLACEHOLDER|${APP_DOMAIN}|" /etc/nginx/sites-available/librechat-npm
      sed -i "s|LIBRECHAT_PORT_PLACEHOLDER|${LIBRECHAT_PORT}|" /etc/nginx/sites-available/librechat-npm

      ln -sf /etc/nginx/sites-available/librechat-npm /etc/nginx/sites-enabled/librechat-npm
      rm -f /etc/nginx/sites-enabled/default
      nginx -t
      systemctl enable --now nginx
      systemctl reload nginx

      # --------------------------------------------------------------------------
      # 18. Enable and start LibreChat systemd service
      # --------------------------------------------------------------------------
      log "Starting LibreChat systemd service..."
      systemctl daemon-reload
      systemctl enable librechat-npm
      systemctl start librechat-npm || log "WARN: librechat-npm start returned non-zero — check journalctl -u librechat-npm"

      # Wait for the backend to actually answer. A flat `sleep 5` reported
      # success while the unit was still in "activating", and reported failure
      # for a service that simply had not finished booting yet.
      LC_READY=0
      for _i in $(seq 1 24); do
        if curl -sf -o /dev/null "http://127.0.0.1:${LIBRECHAT_PORT}/health" 2>/dev/null \
           || curl -sf -o /dev/null "http://127.0.0.1:${LIBRECHAT_PORT}/" 2>/dev/null; then
          LC_READY=1
          log "LibreChat is answering on port ${LIBRECHAT_PORT}."
          break
        fi
        log "  librechat attempt ${_i}/24 ..."
        sleep 5
      done
      if [ "${LC_READY}" -eq 0 ]; then
        log "WARN: LibreChat did not answer on ${LIBRECHAT_PORT} — check journalctl -u librechat-npm"
        journalctl -u librechat-npm --no-pager -n 30 2>&1 | tail -30 || true
      fi

      # --------------------------------------------------------------------------
      # 18b. Create the admin account so the delivered credentials actually work
      #
      # Without this the customer is handed an email/password that no account
      # uses — LibreChat would just wait for someone to self-register. create-user
      # PROMPTS for any argument it is not given, so all four are passed and
      # stdin is detached; otherwise a missing value would hang cloud-init.
      # --------------------------------------------------------------------------
      log "Creating LibreChat admin account for ${LIBRECHAT_ADMIN_EMAIL}..."
      LC_ADMIN_NAME="${LIBRECHAT_ADMIN_EMAIL%%@*}"
      # `env` rather than `sudo VAR=val ...`: sudoers env_reset can refuse
      # command-line environment assignments, and this must not depend on policy.
      ( cd "${LIBRECHAT_DIR}" && sudo -u librechat -H env \
          HOME=/opt/librechat \
          npm_config_cache=/opt/librechat/.npm-cache \
          npm run create-user -- \
            "${LIBRECHAT_ADMIN_EMAIL}" \
            "${LC_ADMIN_NAME}" \
            "${LC_ADMIN_NAME}" \
            "${LIBRECHAT_ADMIN_PASS}" \
            --email-verified=true \
          </dev/null ) \
        || log "WARN: create-user failed (account may already exist) — register at the web UI if needed"

      # --------------------------------------------------------------------------
      # 19. UFW firewall
      # --------------------------------------------------------------------------
      log "Configuring UFW firewall..."
      ufw --force reset
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow 22/tcp    comment 'SSH'
      ufw allow 80/tcp    comment 'HTTP'
      ufw allow 443/tcp   comment 'HTTPS'
      # LibreChat backend only reachable via Nginx; direct port not exposed
      ufw --force enable

      # --------------------------------------------------------------------------
      # 20. fail2ban
      # --------------------------------------------------------------------------
      log "Configuring fail2ban..."
      systemctl enable --now fail2ban

      # --------------------------------------------------------------------------
      # 21. Certbot TLS (optional — never fails the boot if DNS not pointed yet)
      # --------------------------------------------------------------------------
      if [ "${ENABLE_TLS}" = "true" ] && [ "${APP_DOMAIN_IS_FQDN}" -eq 1 ]; then
        log "Requesting Let's Encrypt certificate for ${APP_DOMAIN}..."
        certbot --nginx --non-interactive --agree-tos \
          --email "${LE_EMAIL}" \
          --domains "${APP_DOMAIN}" \
          --redirect \
          || echo "WARN: certbot deferred — DNS not yet pointing here"
      else
        log "Skipping Certbot (ENABLE_TLS=${ENABLE_TLS}, APP_DOMAIN=${APP_DOMAIN} is not a DNS name)"
      fi

      # --------------------------------------------------------------------------
      # 22. Write credentials summary
      # --------------------------------------------------------------------------
      log "Writing credentials file..."

      PUBLIC_IP="$(curl -sf --max-time 5 https://ipv4.icanhazip.com \
                   || curl -sf --max-time 5 https://api.ipify.org \
                   || hostname -I | awk '{print $1}')"

      PROTO="http"
      WEB_HOST="${APP_DOMAIN:-${PUBLIC_IP}}"
      # Only advertise https if certbot could actually have issued a cert, and
      # only if it really did — otherwise the credentials file hands the customer
      # a URL that refuses to connect.
      if [ "${ENABLE_TLS}" = "true" ] && [ "${APP_DOMAIN_IS_FQDN}" -eq 1 ] \
         && [ -d "/etc/letsencrypt/live/${APP_DOMAIN}" ]; then
        PROTO="https"
      fi

      cat > /root/librechat-npm-credentials.txt <<-'CREDS'
      ============================================================
      LibreChat (npm) — Access Credentials
      Generated: DATE_PLACEHOLDER
      ============================================================

      Stack: Node.js 24 + MongoDB 8 + LibreChat (from source)
             + Meilisearch 1.35 (host) + PostgreSQL 16 + pgvector
             + Redis (cache/sessions) + SearXNG (web search) + RAG API
             + Stable Diffusion WebUI (A1111 fork, CPU mode)
             + Miniconda Python 3.10
             + Nginx reverse proxy + UFW + fail2ban + unattended-upgrades
             No Docker, no GPU/CUDA — standard VPS plan

      Public IP      : PUBLIC_IP_PLACEHOLDER
      App domain     : APP_DOMAIN_PLACEHOLDER

      Web UI (nginx) : PROTO_PLACEHOLDER://WEB_HOST_PLACEHOLDER
      Backend direct : http://127.0.0.1:LIBRECHAT_PORT_PLACEHOLDER

      MongoDB (host service, auth enabled):
        Host           : 127.0.0.1:MONGO_PORT_PLACEHOLDER
        Database       : MONGO_DB_NAME_PLACEHOLDER
        Admin user     : MONGO_ADMIN_USER_PLACEHOLDER
        Admin password : MONGO_ADMIN_PASS_PLACEHOLDER

      Meilisearch (host service, search/RAG):
        Host       : 127.0.0.1:MEILI_PORT_PLACEHOLDER
        Master key : MEILI_MASTER_KEY_PLACEHOLDER
        Health URL : http://127.0.0.1:MEILI_PORT_PLACEHOLDER/health

      Vector DB (PostgreSQL 16 + pgvector, RAG):
        Host     : 127.0.0.1:VECTOR_DB_PORT_PLACEHOLDER
        Database : VECTOR_DB_NAME_PLACEHOLDER
        User     : VECTOR_DB_USER_PLACEHOLDER
        Password : VECTOR_DB_PASS_PLACEHOLDER
        Extension: vector (enabled)

      Redis (cache/sessions for LibreChat):
        Host : 127.0.0.1:REDIS_PORT_PLACEHOLDER
        URI  : redis://127.0.0.1:REDIS_PORT_PLACEHOLDER

      RAG API (file uploads, embeddings, retrieval):
        URL      : http://127.0.0.1:RAG_PORT_PLACEHOLDER
        Config   : /etc/rag-api.env
        Uploads  : /opt/rag-api/uploads
        Notes    : Backed by the pgvector database above. Uses local
                   sentence-transformers embeddings when no OpenAI key is
                   set, so uploads work without any API key.

      SearXNG (self-hosted web search for LibreChat):
        URL      : http://127.0.0.1:SEARXNG_PORT_PLACEHOLDER
        Settings : /etc/searxng/settings.yml
        Notes    : Bound to localhost only, reached via LibreChat's
                   SEARXNG_INSTANCE_URL. JSON output format is enabled,
                   which LibreChat's web search requires.

      Stable Diffusion WebUI (A1111 fork, CPU mode):
        URL   : http://127.0.0.1:SD_WEBUI_PORT_PLACEHOLDER
        Port  : SD_WEBUI_PORT_PLACEHOLDER
        Notes : First run downloads models (~10-20 min). Run manually:
                  systemctl start stable-diffusion

      LibreChat .env credentials:
        JWT secret         : JWT_SECRET_PLACEHOLDER
        JWT refresh secret : JWT_REFRESH_SECRET_PLACEHOLDER
        Creds key          : CREDS_KEY_PLACEHOLDER
        Creds IV           : CREDS_IV_PLACEHOLDER

      Admin account (created automatically at boot — log in with these):
        Email    : LIBRECHAT_ADMIN_EMAIL_PLACEHOLDER
        Password : LIBRECHAT_ADMIN_PASS_PLACEHOLDER

      API keys (optional — configure via UI or .env):
        OpenAI     : OPENAI_API_KEY_PLACEHOLDER
        Anthropic  : ANTHROPIC_API_KEY_PLACEHOLDER

      Install dir    : /opt/librechat
      Runtime .env  : /opt/librechat/.env
      Systemd env   : /etc/librechat.env

      Service management:
        LibreChat     : systemctl status librechat-npm
                        journalctl -u librechat-npm -f
        Meilisearch   : systemctl status meilisearch
                        journalctl -u meilisearch -f
        Redis         : systemctl status redis
                        journalctl -u redis -f
        SearXNG       : systemctl status searxng
                        journalctl -u searxng -f
        RAG API       : systemctl status rag-api
                        journalctl -u rag-api -f
        StableDiffusion: systemctl status stable-diffusion
                        journalctl -u stable-diffusion -f
        PostgreSQL    : su - postgres -c "psql -d VECTOR_DB_NAME_PLACEHOLDER"

      Bootstrap log : /var/log/librechat-npm-bootstrap.log

      Next steps:
        1. Point DNS A-record for APP_DOMAIN_PLACEHOLDER to PUBLIC_IP_PLACEHOLDER
        2. Set ENABLE_TLS=true in /root/.librechat-npm-bootstrap.env and re-run:
             certbot --nginx -d <your-domain> --email <you@example.com> --redirect
        3. Register your admin account at PROTO_PLACEHOLDER://WEB_HOST_PLACEHOLDER
        4. Add LLM API keys via Settings → API Keys after login
        5. Rebuild after .env changes:
             sudo systemctl restart librechat-npm
        6. Meilisearch runs on port MEILI_PORT_PLACEHOLDER — configure RAG settings in LibreChat
        7. Vector DB runs on port VECTOR_DB_PORT_PLACEHOLDER — ensure your RAG pipeline uses these credentials
        8. Redis runs on port REDIS_PORT_PLACEHOLDER — enabled for cache/sessions in LibreChat
        9. SearXNG runs on port SEARXNG_PORT_PLACEHOLDER — enable Web Search in LibreChat settings
       10. RAG API runs on port RAG_PORT_PLACEHOLDER — powers file uploads and retrieval
       11. Stable Diffusion WebUI runs on port SD_WEBUI_PORT_PLACEHOLDER — configure SD endpoint in LibreChat
      ============================================================
      CREDS
      # Substitute placeholders
      sed -i "s|DATE_PLACEHOLDER|$(date -u '+%Y-%m-%dT%H:%M:%SZ')|g" /root/librechat-npm-credentials.txt
      sed -i "s|PUBLIC_IP_PLACEHOLDER|${PUBLIC_IP}|g" /root/librechat-npm-credentials.txt
      sed -i "s|APP_DOMAIN_PLACEHOLDER|${APP_DOMAIN:-Not configured}|g" /root/librechat-npm-credentials.txt
      sed -i "s|PROTO_PLACEHOLDER|${PROTO}|g" /root/librechat-npm-credentials.txt
      sed -i "s|WEB_HOST_PLACEHOLDER|${WEB_HOST}|g" /root/librechat-npm-credentials.txt
      sed -i "s|LIBRECHAT_PORT_PLACEHOLDER|${LIBRECHAT_PORT}|g" /root/librechat-npm-credentials.txt
      sed -i "s|MONGO_ADMIN_PASS_PLACEHOLDER|${MONGO_ADMIN_PASS}|g" /root/librechat-npm-credentials.txt
      sed -i "s|MONGO_ADMIN_USER_PLACEHOLDER|${MONGO_ADMIN_USER}|g" /root/librechat-npm-credentials.txt
      sed -i "s|MONGO_PORT_PLACEHOLDER|${MONGO_PORT}|g" /root/librechat-npm-credentials.txt
      sed -i "s|MONGO_DB_NAME_PLACEHOLDER|${MONGO_DB_NAME}|g" /root/librechat-npm-credentials.txt
      sed -i "s|MEILI_MASTER_KEY_PLACEHOLDER|${MEILI_MASTER_KEY}|g" /root/librechat-npm-credentials.txt
      sed -i "s|MEILI_PORT_PLACEHOLDER|${MEILI_PORT}|g" /root/librechat-npm-credentials.txt
      sed -i "s|VECTOR_DB_PASS_PLACEHOLDER|${VECTOR_DB_PASS}|g" /root/librechat-npm-credentials.txt
      sed -i "s|VECTOR_DB_PORT_PLACEHOLDER|${VECTOR_DB_PORT}|g" /root/librechat-npm-credentials.txt
      sed -i "s|VECTOR_DB_NAME_PLACEHOLDER|${VECTOR_DB_NAME}|g" /root/librechat-npm-credentials.txt
      sed -i "s|VECTOR_DB_USER_PLACEHOLDER|${VECTOR_DB_USER}|g" /root/librechat-npm-credentials.txt
      sed -i "s|REDIS_PORT_PLACEHOLDER|${REDIS_PORT}|g" /root/librechat-npm-credentials.txt
      sed -i "s|SEARXNG_PORT_PLACEHOLDER|${SEARXNG_PORT}|g" /root/librechat-npm-credentials.txt
      sed -i "s|RAG_PORT_PLACEHOLDER|${RAG_PORT}|g" /root/librechat-npm-credentials.txt
      sed -i "s|SD_WEBUI_PORT_PLACEHOLDER|${SD_WEBUI_PORT}|g" /root/librechat-npm-credentials.txt
      sed -i "s|JWT_SECRET_PLACEHOLDER|${JWT_SECRET}|g" /root/librechat-npm-credentials.txt
      sed -i "s|JWT_REFRESH_SECRET_PLACEHOLDER|${JWT_REFRESH_SECRET}|g" /root/librechat-npm-credentials.txt
      sed -i "s|CREDS_KEY_PLACEHOLDER|${CREDS_KEY}|g" /root/librechat-npm-credentials.txt
      sed -i "s|CREDS_IV_PLACEHOLDER|${CREDS_IV}|g" /root/librechat-npm-credentials.txt
      sed -i "s|LIBRECHAT_ADMIN_EMAIL_PLACEHOLDER|${LIBRECHAT_ADMIN_EMAIL}|g" /root/librechat-npm-credentials.txt
      sed -i "s|LIBRECHAT_ADMIN_PASS_PLACEHOLDER|${LIBRECHAT_ADMIN_PASS}|g" /root/librechat-npm-credentials.txt
      sed -i "s|OPENAI_API_KEY_PLACEHOLDER|${OPENAI_API_KEY}|g" /root/librechat-npm-credentials.txt
      sed -i "s|ANTHROPIC_API_KEY_PLACEHOLDER|${ANTHROPIC_API_KEY}|g" /root/librechat-npm-credentials.txt
      chmod 600 /root/librechat-npm-credentials.txt

      log "=== LibreChat (npm) bootstrap complete: $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
      log "=== Credentials saved to /root/librechat-npm-credentials.txt ==="

# ----------------------------------------------------------------------------
# Run the bootstrap once all write_files are on disk
# ----------------------------------------------------------------------------
bootcmd:
  # Free the dpkg/apt lock before cloud-init's package stage: gracefully stop
  # (SIGTERM, NOT kill -9) unattended-upgrades + apt-daily so they release the
  # lock, and mask the timers/services so they don't restart this boot.
  - [ cloud-init-per, instance, ci-apt-quiesce, sh, -c, "systemctl stop unattended-upgrades.service apt-daily.service apt-daily-upgrade.service 2>/dev/null; systemctl mask apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service 2>/dev/null; true" ]

runcmd:
  - [ bash, -lc, "/root/librechat-npm-bootstrap.sh" ]

# ----------------------------------------------------------------------------
# Final message shown in cloud-init output
# ----------------------------------------------------------------------------
final_message: |
  ============================================================
  LibreChat (npm) bootstrap has finished.
  Elapsed time: $UPTIME seconds since boot.

  Stack: Node.js 24 + MongoDB 8.0 (host) + LibreChat (from source)
         + Meilisearch 1.35.1 (host) + PostgreSQL 16 + pgvector
         + Redis (cache/sessions) + SearXNG (web search) + RAG API
         + Stable Diffusion WebUI (A1111 fork, CPU mode)
         + Miniconda Python 3.10
         + Nginx reverse proxy + UFW + fail2ban + unattended-upgrades
         No Docker, no GPU — runs on any standard VPS plan

  Access details and generated credentials:
    cat /root/librechat-npm-credentials.txt

  Service management:
    systemctl status librechat-npm
    journalctl -u librechat-npm -f
    systemctl status meilisearch
    journalctl -u meilisearch -f
    systemctl status redis
    journalctl -u redis -f
    systemctl status searxng
    journalctl -u searxng -f
    systemctl status rag-api
    journalctl -u rag-api -f
    systemctl status stable-diffusion
    journalctl -u stable-diffusion -f

  Bootstrap log:
    /var/log/librechat-npm-bootstrap.log
  ============================================================
